<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>{{project_title}}</title>
    <!-- Round 7.16 (BUG-8): Favicon + OG meta สำหรับ Richbiotech Ads Dashboard -->
    <link rel="icon" type="image/png" href="/manus-storage/logo_329a1fce.png" />
    <link rel="apple-touch-icon" href="/manus-storage/logo_329a1fce.png" />
    <meta name="description" content="Richbiotech Ads Dashboard — ระบบบริหารงบโฆษณา Facebook และคอมมิชชั่นสำหรับ Agency ไทย" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{project_title}}" />
    <meta property="og:description" content="ระบบบริหารงบโฆษณา Facebook และคอมมิชชั่นของ Richbiotech" />
    <meta property="og:image" content="/manus-storage/logo_329a1fce.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="/manus-storage/logo_329a1fce.png" />
    <meta name="theme-color" content="#f97316" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme') || 'system';
          var isDark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', isDark);
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
